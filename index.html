<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clicky Addicty</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:16px 14px 44px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    transition:background .3s,color .3s;
    user-select:none;-webkit-tap-highlight-color:transparent;
    --bg:#0b0d12;--panel:#141821;--line:#232a38;--text:#e6ecf5;
    --dim:#7f8ca3;--accent:#5eead4;--accent2:#a78bfa;
  }
  body.theme-midnight{--bg:#0b0d12;--panel:#141821;--line:#232a38;--text:#e6ecf5;--dim:#7f8ca3;--accent:#5eead4;--accent2:#a78bfa}
  body.theme-neon{--bg:#0a0014;--panel:#170029;--line:#3d0a63;--text:#f5e8ff;--dim:#a37bd1;--accent:#ff2fd0;--accent2:#00e5ff}
  body.theme-paper{--bg:#f2ede3;--panel:#fffdf7;--line:#ddd5c4;--text:#2a2620;--dim:#8a8172;--accent:#c2410c;--accent2:#0369a1}
  body.theme-terminal{--bg:#000;--panel:#06120a;--line:#0f3d22;--text:#8bffb0;--dim:#3f7a55;--accent:#00ff66;--accent2:#00cc52}
  body.theme-vapor{--bg:#2b1055;--panel:#3d1a75;--line:#6b3fb5;--text:#ffe9ff;--dim:#b79ee0;--accent:#ff71ce;--accent2:#01cdfe}
  body.theme-hell{--bg:#12060a;--panel:#1e0a10;--line:#4a1220;--text:#ffd9d9;--dim:#b06a72;--accent:#ff3b30;--accent2:#ffa000}

  header{text-align:center}
  h1{margin:0;font-size:clamp(20px,5vw,30px);letter-spacing:4px;color:var(--accent)}
  .sub{font-size:11px;color:var(--dim);letter-spacing:1px;margin-top:4px}

  .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
  .stat{flex:1 1 90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;text-align:center}
  .stat .label{display:block;font-size:9px;letter-spacing:1px;color:var(--dim)}
  .stat span:last-child{font-size:15px;color:var(--accent2)}

  .progress{width:100%;max-width:520px;height:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}
  #bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s linear}

  .pad{
    position:relative;width:100%;max-width:520px;height:200px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),var(--panel);
    border:1px solid var(--line);border-radius:16px;cursor:none;overflow:hidden;
    transition:transform .07s;
  }
  .pad:active{transform:scale(.985)}
  .pad.shake{animation:sh .12s}
  @keyframes sh{50%{transform:translate(2px,-2px)}}
  .count{font-size:clamp(30px,9vw,48px);font-weight:700;letter-spacing:1px;color:var(--text)}
  .hint{font-size:10px;letter-spacing:3px;color:var(--dim);margin-top:6px}

  .follower{position:absolute;left:-99px;top:-99px;transform:translate(-50%,-50%);pointer-events:none;font-size:26px;line-height:1;z-index:6;text-shadow:0 0 12px var(--accent)}
  .follower.small{font-size:17px}

  .float{position:absolute;pointer-events:none;font-size:14px;font-weight:700;color:var(--accent);animation:fl .8s ease-out forwards;z-index:5}
  @keyframes fl{to{transform:translate(-50%,-46px);opacity:0}}

  .tabs{display:flex;gap:6px;width:100%;max-width:520px}
  .tab{flex:1;padding:8px;font:inherit;font-size:11px;letter-spacing:1px;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .tab.active{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700}

  .panel{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px}
  .panel.hidden{display:none}
  .sechead{font-size:10px;letter-spacing:2px;color:var(--dim);margin:8px 0 2px}

  .item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    font:inherit;color:var(--text);cursor:pointer;text-align:left}
  .item:hover:not(.locked){border-color:var(--accent)}
  .item.locked{opacity:.42}
  .item.equipped{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .iname{font-size:13px}
  .iname em{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:2px}
  .icost{font-size:11px;color:var(--accent2);white-space:nowrap}
  .own{font-size:10px;color:var(--dim);margin-left:6px}

  .statslist{font-size:12px;line-height:1.9;color:var(--dim)}
  .statslist b{color:var(--text)}

  .footer{display:flex;gap:8px}
  .footer button{font:inherit;font-size:10px;letter-spacing:1px}
